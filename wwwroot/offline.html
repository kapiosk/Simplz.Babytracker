<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Baby Tracker — offline</title>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <main class="app-main" style="text-align:center; padding-top:20vh;">
        <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim)">
            <path d="M3 3l18 18M5 12.5a11 11 0 0 1 4-2.6M2 8.8A16 16 0 0 1 9 5.4M15 5.4a16 16 0 0 1 7 3.4M15.5 10a11 11 0 0 1 3.5 2.5M9 16a5 5 0 0 1 6 0M12 20h.01" />
        </svg>
        <h1>You're offline</h1>
        <p style="color:var(--text-dim)">Baby Tracker needs a connection to the home server.
           Reconnect to Wi-Fi and try again.</p>
        <button class="btn primary" onclick="location.reload()">Retry</button>
    </main>
</body>
</html>
